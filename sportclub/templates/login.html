{% extends 'base.html' %}
{% block title %}Вход — {{ CLUB_NAME }}{% endblock %}
{% block content %}
<div class="container page">
  <div class="card form-card">
    <h1 class="page-title">Вход</h1>
    <p class="page-sub">Войдите, чтобы купить абонемент и записаться на занятия.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autofocus autocomplete="username">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <label class="check"><input type="checkbox" name="remember"> Запомнить меня на 7 дней</label>
      <div class="form-actions"><button class="btn btn-primary btn-block" type="submit">Войти</button></div>
    </form>
    <p class="auth-switch">Нет аккаунта? <a href="{{ url_for('register', next=next) }}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
