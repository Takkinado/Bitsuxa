{% extends 'base.html' %}
{% block title %}Регистрация — {{ CLUB_NAME }}{% endblock %}
{% block content %}
<div class="container page">
  <div class="card form-card">
    <h1 class="page-title">Регистрация</h1>
    <p class="page-sub">Создайте аккаунт клиента — это займёт минуту.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <label for="full_name">ФИО</label>
      <input id="full_name" name="full_name" value="{{ form.get('full_name','') }}" required minlength="2" maxlength="100" autocomplete="name">
      <label for="phone">Телефон</label>
      <input id="phone" name="phone" type="tel" value="{{ form.get('phone','') }}" placeholder="+7 999 123-45-67" required autocomplete="tel">
      <label for="email">E-mail (будет логином)</label>
      <input id="email" name="email" type="email" value="{{ form.get('email','') }}" required autocomplete="email">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" minlength="6" required autocomplete="new-password">
      <div class="help">Не короче 6 символов.</div>
      <label for="password2">Повторите пароль</label>
      <input id="password2" name="password2" type="password" minlength="6" required autocomplete="new-password">
      <div class="form-actions"><button class="btn btn-primary btn-block" type="submit">Создать аккаунт</button></div>
    </form>
    <p class="auth-switch">Уже есть аккаунт? <a href="{{ url_for('login', next=next) }}">Войти</a></p>
  </div>
</div>
{% endblock %}
